packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

engineStrict: true
saveExact: true

# Preserve the version already installed and verified by task 0001.
minimumReleaseAgeExclude:
  - "lucide-react@1.42.0"
